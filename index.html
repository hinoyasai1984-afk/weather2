<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>日本主要都市 気象データダッシュボード</title>
<link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
<div class="viz-root">

  <a class="back-link" href="https://hinoyasai1984-afk.github.io/">← アプリ一覧に戻る</a>

  <header class="app-header">
    <div>
      <h1>日本主要都市 気象データダッシュボード</h1>
      <p class="subtitle">過去の気温・降水量の推移を都市別に比較</p>
    </div>
    <div class="header-actions">
      <button id="share-link" class="share-link-btn" type="button" title="このページのリンクをコピー" aria-label="このページのリンクをコピー">🔗</button>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="配色を切り替え">🌓</button>
    </div>
  </header>

  <section class="filters" aria-label="表示条件">
    <div class="filter-group" role="group" aria-label="期間">
      <span class="filter-label">期間</span>
      <div class="preset-row" id="range-presets">
        <button class="preset-btn" data-days="7">過去7日間</button>
        <button class="preset-btn is-selected" data-days="30">過去30日間</button>
        <button class="preset-btn" data-days="90">過去90日間</button>
      </div>
    </div>
    <div class="filter-group" role="group" aria-label="都市">
      <span class="filter-label">都市</span>
      <div class="city-row" id="city-checkboxes"></div>
    </div>
  </section>

  <section class="stat-row" id="stat-row" aria-label="最新の観測値"></section>

  <section class="chart-card">
    <div class="chart-card-head">
      <h2>平均気温の推移</h2>
      <div class="legend" id="legend-temp"></div>
    </div>
    <div class="chart-wrap">
      <canvas id="chart-temp" role="img" aria-label="都市別の平均気温の推移を示す折れ線グラフ"></canvas>
    </div>
  </section>

  <section class="chart-card">
    <div class="chart-card-head">
      <h2>降水量の推移</h2>
      <div class="legend" id="legend-precip"></div>
    </div>
    <div class="chart-wrap">
      <canvas id="chart-precip" role="img" aria-label="都市別の降水量の推移を示す棒グラフ"></canvas>
    </div>
  </section>

  <section class="table-section">
    <button id="table-toggle" class="table-toggle-btn" type="button" aria-expanded="false" aria-controls="table-wrap">
      表形式で見る
    </button>
    <div id="table-wrap" class="table-wrap" hidden></div>
  </section>

  <p id="status-line" class="status-line" role="status">読み込み中…</p>

  <footer class="app-footer">
    データ提供:
    <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
    （CC BY 4.0）
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="app.js?v=3"></script>
</body>
</html>
